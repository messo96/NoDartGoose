<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NoDarts Goose</title>
<meta name="theme-color" content="#160c31">
<meta name="description" content="Segnapunti, classifiche e stagioni per le vostre partite a freccette.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NoDarts Goose">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/goose.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/goose.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Unbounded:wght@700;800;900&family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* NoDarts Goose: notte viola, bersaglio arcobaleno, oche psichedeliche.
   Layout: barra in alto (in basso su telefono), una vista alla volta; in partita tabellone sopra e tastiera sotto (affiancati su tablet orizzontale). */
:root{
  color-scheme: dark;
  --ink:#160c31; --ink-2:#21154a; --ink-3:#2e2064; --line:#45358f;
  --cream:#fff4e3; --muted:#bcafee;
  --r1:#ff3d7f; --r2:#ff8c2b; --r3:#ffd23f; --r4:#3ee59a; --r5:#33b6ff; --r6:#a463ff;
  --rainbow:linear-gradient(90deg,var(--r1),var(--r2),var(--r3),var(--r4),var(--r5),var(--r6));
  --f-display:"Unbounded","Arial Black","Helvetica Neue",Arial,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --rl:22px; --rm:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
main{overflow-x:clip}
button,a,.chip,.btn,.key,label{touch-action:manipulation}
.btn,.chip,.key,.qk,.mult,.tabs a{-webkit-user-select:none;user-select:none}
body{background:var(--ink);color:var(--cream);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 8% -8%,rgba(255,61,127,.22),transparent 38%),radial-gradient(circle at 105% 18%,rgba(51,182,255,.18),transparent 42%),radial-gradient(circle at 50% 118%,rgba(164,99,255,.32),transparent 52%)}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--cream);background:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:110px;font-size:13px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--r5);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{text-wrap:balance}

/* Top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:rgba(22,12,49,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rainbow)}
.brand{display:flex;align-items:center;gap:8px;color:var(--cream);text-decoration:none}
.brand .goose{width:48px;height:48px}
.wordmark{font-family:var(--f-display);font-weight:900;letter-spacing:0;line-height:1.02;margin:0;color:var(--cream)}
.brand .wordmark{white-space:nowrap;font-size:19px;text-shadow:1px 1px 0 var(--r1),2px 2px 0 var(--r2),3px 3px 0 var(--r3),4px 4px 0 var(--r4),5px 5px 0 var(--r5)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs a{padding:9px 15px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:700}
.tabs a:hover{color:var(--cream)}
.tabs a[aria-current="page"]{background:var(--cream);color:var(--ink)}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted)}
.sync .sshort{display:none}
.sync.cloud::before{background:var(--r4)} .sync.ro::before{background:var(--r3)} .sync.local::before{background:var(--r1)}
.install-app{white-space:nowrap}
.install-app[hidden]{display:none}
main{min-height:calc(100% - 66px)}

/* Generic */
.page{max-width:1120px;margin:0 auto;padding:26px 16px 56px;display:flex;flex-direction:column;gap:22px}
.h1{font-family:var(--f-display);font-weight:900;font-size:clamp(32px,4.4vw,52px);line-height:1.08;letter-spacing:-.5px;margin:0;text-shadow:2px 2px 0 var(--r1),4px 4px 0 var(--r2),6px 6px 0 var(--r5)}
.h2{font-family:var(--f-display);font-weight:800;font-size:clamp(21px,2.4vw,26px);line-height:1.15;letter-spacing:-.3px;margin:0}
.h3{font-size:18px;font-weight:800;margin:0}
.hint{color:var(--muted);font-size:14px;margin:0}
.panel{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--rl);padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:700;color:var(--muted);font-size:14px;padding:0;margin-bottom:8px}
.btn{border:0;border-radius:999px;padding:11px 20px;min-height:44px;cursor:pointer;background:var(--ink-3);color:var(--cream);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.primary{background:var(--r3);color:var(--ink)}
.btn.hot{background:var(--r1);color:var(--ink)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{min-height:38px;padding:7px 14px;font-size:14px}
.btn.big{font-size:21px;padding:16px 30px;min-height:60px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;box-shadow:inset 0 0 0 2px var(--line);background:transparent;border-radius:999px;padding:9px 15px;min-height:42px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.chip:hover{box-shadow:inset 0 0 0 2px var(--muted)}
.chip[aria-pressed="true"]{background:var(--cream);color:var(--ink);box-shadow:none}
.chip .goose{width:34px;height:34px;margin:-8px 0 -8px -10px}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:var(--ink-3);font-size:13px;font-weight:600;white-space:nowrap}
.tag.y{background:var(--r3);color:var(--ink)} .tag.p{background:var(--r1);color:var(--ink)} .tag.g{background:var(--r4);color:var(--ink)}
.empty{padding:22px;border:2px dashed var(--line);border-radius:var(--rm);color:var(--muted);text-align:center}
.notice{padding:12px 16px;border-radius:var(--rm);background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.4);font-size:14px}

/* Goose */
.goose{display:block;width:36px;height:36px;flex:none;overflow:visible}
.goose.trip{animation:trip 16s linear infinite}
.goose.dance{animation:dance 1.3s ease-in-out infinite,trip 5s linear infinite}
@keyframes trip{to{filter:hue-rotate(360deg)}}
@keyframes dance{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(7deg) translateY(-10px)}}
@keyframes bob{50%{transform:translateY(-3px) rotate(-5deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Home */
.home{max-width:1220px;margin:0 auto;padding:28px 16px 56px;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.15fr);gap:32px;align-items:start}
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:18px;position:sticky;top:96px}
.dboard{position:relative;width:min(500px,84vw);aspect-ratio:1;margin:5% 0}
.dboard .aura{position:absolute;inset:-10%;border-radius:50%;background:conic-gradient(#ff3d7f,#ff8c2b,#ffd23f,#3ee59a,#33b6ff,#a463ff,#ff4fd8,#ff3d7f);filter:blur(30px);opacity:.6;animation:spin 22s linear infinite}
.dboard .dface{position:absolute;inset:0;filter:drop-shadow(0 24px 40px rgba(6,2,20,.7))}
.dboard .face,.dboard .core{position:absolute;inset:0}
.dboard .face svg,.dboard .core svg{display:block;width:100%;height:100%;animation:trip 14s linear infinite}
.dboard .core{animation:spin 38s linear infinite}
.dboard .emblem .lt{transform-box:fill-box;transform-origin:center;animation:lpop 4.2s ease-in-out infinite}
.dboard .emblem .trl{animation:trail 4.2s ease-in-out infinite}
.dboard .emblem .gbob{transform-box:fill-box;transform-origin:50% 90%;animation:gsway 3.4s ease-in-out infinite}
@keyframes lpop{0%,16%,100%{transform:none}8%{transform:translateY(-7px) scale(1.16)}}
@keyframes trail{0%,100%{opacity:1}8%{opacity:.25}16%{opacity:1}}
@keyframes gsway{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-6px)}}
.dboard .moire{position:absolute;inset:7.5%;border-radius:50%;background:repeating-conic-gradient(rgba(255,244,227,.16) 0 2.25deg,transparent 2.25deg 4.5deg);mix-blend-mode:overlay;animation:spin 70s linear infinite reverse;pointer-events:none}
.dboard .ripple{position:absolute;inset:7.5%;border-radius:50%;background:repeating-radial-gradient(circle,rgba(22,12,49,.0) 0 9px,rgba(22,12,49,.22) 9px 12px);mix-blend-mode:multiply;animation:breathe 6s ease-in-out infinite;pointer-events:none}
.dboard .emblem{position:absolute;inset:0;pointer-events:none}
.dboard .emblem svg{display:block;width:100%;height:100%;filter:drop-shadow(0 6px 14px rgba(6,2,20,.55))}
.brandmark{display:block;width:50px;height:50px;flex:none;border-radius:50%;box-shadow:0 0 0 2px rgba(14,7,36,.9),0 0 12px rgba(255,61,127,.45)}
.brandmark svg{display:block;width:100%;height:100%;animation:trip 20s linear infinite}
@keyframes breathe{50%{transform:scale(1.035)}}
.hero .wordmark{font-size:clamp(68px,9.5vw,124px);text-shadow:3px 3px 0 var(--r1),6px 6px 0 var(--r2),9px 9px 0 var(--r3),12px 12px 0 var(--r4),15px 15px 0 var(--r5),18px 18px 0 var(--r6);margin-bottom:12px}
.lede{font-size:19px;max-width:44ch;margin:0}
.setup{gap:22px}
.setup .opts{display:grid;gap:18px}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--ink);border-radius:999px;padding:4px}
.stepper button{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink-3);cursor:pointer;font-size:20px;font-weight:800}
.stepper output{min-width:34px;text-align:center;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.steplbl{display:flex;align-items:center;gap:10px;font-weight:600}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pk{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;border:0;border-radius:16px;background:var(--ink);box-shadow:inset 0 0 0 2px var(--line);cursor:pointer;color:var(--cream);min-width:0}
.pk .goose{width:62px;height:62px}
.pk b{font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk[aria-pressed="true"]{background:var(--ink-3);box-shadow:inset 0 0 0 3px var(--r3)}
.pk:not([aria-pressed="true"]) .goose{opacity:.75;filter:saturate(.75)}
.pkn{position:absolute;top:6px;right:6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--r3);color:var(--ink);font-weight:900;font-size:14px;display:grid;place-items:center}
.pk.add{box-shadow:inset 0 0 0 2px var(--line);background:transparent;border:2px dashed var(--line)}
.pkplus{width:62px;height:62px;display:grid;place-items:center;font-size:40px;font-weight:300;color:var(--muted);line-height:1}
.pwform{display:flex;flex-direction:column;gap:14px}
.pwform p{margin:0}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.order{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.order li{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 6px;border-radius:12px;background:var(--ink)}
.order .ord{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--cream);color:var(--ink);font-weight:800;font-size:14px;flex:none}
.order .goose{width:36px;height:36px}
.order.sortable li{position:relative;user-select:none;-webkit-user-select:none}
@media (pointer:fine){.order.sortable li{cursor:grab}}
.drag{width:48px;height:44px;margin:-4px -4px -4px 0;border:0;border-radius:12px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:grab;touch-action:none;flex:none}
.drag:hover{color:var(--cream);background:var(--ink-3)}
.order li.dragging{z-index:3;background:var(--ink-3);box-shadow:0 10px 24px rgba(0,0,0,.45),inset 0 0 0 2px var(--r3);cursor:grabbing}
.order li.dragging .drag{color:var(--r3);cursor:grabbing}
.order.sorting li:not(.dragging){transition:transform .12s}
.icon{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink-3);cursor:pointer;font-weight:800;flex:none}
.icon:disabled{opacity:.3;cursor:default}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1}
.resume{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px;border-radius:var(--rm);background:var(--ink-3);border:2px solid var(--r3)}

/* Tables */
.tblwrap{overflow-x:auto;border-radius:var(--rm);border:1px solid var(--line);background:var(--ink-2)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:540px}
.tbl th,.tbl td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{font-size:13px;color:var(--muted);font-weight:700;background:var(--ink-3)}
.tbl thead th button{all:unset;cursor:pointer;border-radius:6px;padding:2px 4px}
.tbl thead th button:focus-visible{outline:3px solid var(--r5)}
.tbl thead th[aria-sort] button{color:var(--cream)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl td.big{font-weight:800;font-size:18px}
.who{display:flex;align-items:center;gap:8px;font-weight:700}
.who .goose{width:40px;height:40px;margin:-4px 0}
.pos{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink-3);font-weight:800;font-size:13px;margin-right:4px}
.pos.n1{background:var(--r3);color:var(--ink)} .pos.n2{background:var(--r5);color:var(--ink)} .pos.n3{background:var(--r2);color:var(--ink)}
.form{display:inline-flex;gap:3px}
.form i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.form i.w{background:var(--r4)} .form i.l{background:var(--r1)}

/* Podium */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:10px;max-width:560px;width:100%}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .goose{width:92px;height:92px}
.pod .nm{font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .sub{font-size:13px;color:var(--muted)}
.pod .step{width:100%;border-radius:16px 16px 0 0;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:32px;color:var(--ink)}
.pod.p1 .step{height:124px;background:var(--r3)} .pod.p2 .step{height:92px;background:var(--r5)} .pod.p3 .step{height:68px;background:var(--r2)}
.pod.p1 .goose{width:118px;height:118px}

/* History */
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;padding:14px 16px;border-radius:var(--rm);background:var(--ink-2);border:1px solid var(--line)}
.mmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.mplayers{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 18px}
.mplayers li{display:flex;align-items:center;gap:8px}
.mplayers .goose{width:36px;height:36px}
.mplayers .win{font-weight:800}
.mplayers small{color:var(--muted);font-variant-numeric:tabular-nums}
.crown{color:var(--r3);font-size:13px;font-weight:800}

/* Players */
.plist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.pitem{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--rm);background:var(--ink-2);border:1px solid var(--line)}
.pitem .goose{width:92px;height:92px}
.gbtn{border:0;padding:0;background:none;cursor:pointer;border-radius:16px}
.gbtn:hover .goose{transform:rotate(-6deg)}
.pitem .nm{font-weight:800;font-size:19px}
.pitem .st{font-size:14px;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink),0 0 0 5px var(--cream)}

/* Seasons */
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.formgrid label,.fl{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--ink);font-weight:600;color:var(--cream);cursor:pointer}
.checks input{width:18px;height:18px;min-height:0;accent-color:var(--r3)}
.adjlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.adjlist li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--ink)}
.adjlist .goose{width:36px;height:36px}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}

/* Game */
body.in-game .top{display:none}
body.in-game main{height:100%;min-height:0}
.game{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;max-width:1500px;margin:0 auto}
.gbody,.pad{min-width:0}
body{overflow-x:clip}
.gbar{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 16px 10px}
.gtitle{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.gtitle strong{font-family:var(--f-display);font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtitle span{font-size:13px;color:var(--muted)}
.gbody{overflow:auto;padding:4px 16px 16px;min-height:0}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pcard{position:relative;display:flex;flex-direction:column;gap:4px;padding:12px 14px 14px;border-radius:18px;background:var(--ink-2);border:2px solid transparent;min-width:0;overflow:hidden}
.pcard.on{background:var(--ink-3);border-color:var(--r3)}
.pcard.on::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--rainbow)}
.pcard.on .goose{animation:bob 1.6s ease-in-out infinite}
.pcard.out{opacity:.4}
.pc-head{display:flex;align-items:center;gap:8px;min-width:0}
.pc-head .goose{width:52px;height:52px;margin:-6px 0}
.pname{font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.legs{display:flex;gap:4px;flex:none}
.legs b{font-size:12px;padding:2px 7px;border-radius:999px;background:var(--ink);font-variant-numeric:tabular-nums}
.pscore{font-weight:900;font-size:var(--sz,64px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.pmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pmeta b{color:var(--cream);font-weight:700}
.n1 .pscore,.n2 .pscore{--sz:clamp(64px,13vw,120px)}
.scores.solo{grid-template-columns:minmax(0,640px);justify-content:center}
.scores.solo .pcard{align-items:center;text-align:center;padding:16px 18px 18px;gap:8px}
.scores.solo .pc-head{flex-direction:column;gap:2px}
.scores.solo .pc-head .goose{width:96px;height:96px;margin:0}

.ktargets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

@media (max-width:720px){.gbar [data-act="undo"]{display:none}.gbar{gap:8px}}

/* Cricket board */

/* ATC + killer */

.botstart{display:flex;flex-direction:column;gap:8px;margin-top:12px}

.botmsg{display:flex;align-items:center;justify-content:center;gap:10px;margin:0;padding:14px;border-radius:14px;background:var(--ink);font-weight:700;color:var(--muted)}
.dots{display:inline-flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--r3);animation:blink 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s;background:var(--r4)}
.dots i:nth-child(3){animation-delay:.3s;background:var(--r5)}

/* Camerino */
.modal .row > .goose{width:72px;height:72px}

.stage{position:sticky;top:86px;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px;border-radius:var(--rl);border:1px solid var(--line);background:radial-gradient(circle at 50% 36%,var(--ink-3) 0,var(--ink-2) 62%)}

.stage-ctl{display:flex;flex-direction:column;gap:12px;width:100%}
.stage-ctl .row{justify-content:center}
.wardrobe{display:flex;flex-direction:column;gap:24px;min-width:0}

.wtabs{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt.special{background:linear-gradient(160deg,#3a2a12,var(--ink-2) 60%);box-shadow:inset 0 0 0 2px #c8902a}

.opt .spb{position:absolute;top:5px;right:7px;font-style:normal;font-size:14px;color:#ffd23f;line-height:1}
.opt.locked{cursor:default;opacity:.9;background:repeating-linear-gradient(135deg,var(--ink) 0 8px,var(--ink-2) 8px 16px);box-shadow:inset 0 0 0 2px #6b5320;color:#ffd23f}
.opt .lockbox{display:grid;place-items:center;width:76px;height:76px}
.trophyline{display:flex;align-items:center;gap:8px;margin:0;font-size:14px;color:var(--cream)}
.trophyline.sm{font-size:13px;color:#ffd23f;margin-top:2px}
.cupi{width:22px;height:22px;flex:none}
.trophyline.sm .cupi{width:17px;height:17px}
.albo{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:8px}

.trform{display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px dashed var(--line)}
.unlock{display:flex;align-items:center;gap:14px}

.wtabs .chip[aria-selected="true"]{background:var(--cream);color:var(--ink);box-shadow:none}
.wpanel{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:var(--rl);background:var(--ink-2);border:1px solid var(--line)}

.wphead .icon{font-size:24px;line-height:1;width:42px;height:42px}

.wopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px 10px;border:0;border-radius:16px;background:var(--ink-2);box-shadow:inset 0 0 0 2px var(--line);cursor:pointer;font-size:13px;font-weight:600;line-height:1.2;text-align:center}
.opt:hover{box-shadow:inset 0 0 0 2px var(--muted)}
.opt .goose{width:76px;height:76px;overflow:hidden;border-radius:10px}
.opt[aria-pressed="true"]{background:var(--ink-3);box-shadow:inset 0 0 0 3px var(--r3)}
@media (max-width:860px){
  .dress{grid-template-columns:1fr;gap:18px}
  .stage{top:60px;z-index:6;display:grid;grid-template-columns:120px minmax(0,1fr);align-items:center;gap:12px;padding:10px 12px;background:var(--ink-2);box-shadow:0 12px 24px rgba(10,5,25,.5)}

  .stage-ctl .row{justify-content:flex-start;gap:6px}

  .opt .goose{width:64px;height:64px}
  .wopts{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .wtabs{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
  .wtabs::-webkit-scrollbar{display:none}
  .wtabs .chip{flex:none}
  .wpanel{padding:12px}
  .opt .lockbox{width:64px;height:64px}
  .unlock .goose{width:110px;height:110px}

/* Overlays */
.scrim{position:fixed;inset:0;background:rgba(10,5,25,.72);z-index:50}
.modal{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--ink-2);border:2px solid var(--line);border-radius:var(--rl);padding:22px;display:flex;flex-direction:column;gap:16px}
.modal::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--rainbow);border-radius:var(--rl) var(--rl) 0 0}
.mact{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.bigchoice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bigchoice .key{min-height:70px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--cream);color:var(--ink);padding:12px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Winner */
.winscreen{display:flex;flex-direction:column;align-items:center;gap:18px;padding:12px 0 24px;text-align:center}

@media (min-width:980px) and (orientation:landscape){
  .game{grid-template-columns:minmax(0,1fr) 440px;grid-template-rows:auto minmax(0,1fr)}

}
@media (max-width:860px){
  .home{grid-template-columns:1fr;gap:24px}

}
@media (min-width:721px) and (max-width:860px){

}
@media (max-width:720px){
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:space-around;background:rgba(22,12,49,.97);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30}
  .tabs a{padding:10px 12px;font-size:14px}
  main{padding-bottom:78px}
  body.in-game main{padding-bottom:0}
  .sync{margin-left:auto}
  .install-app{min-height:38px;padding:7px 10px;font-size:13px}
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--ink)}
  .brand .wordmark{font-size:14px}
  .brand .goose{width:34px;height:34px}
  .sync{font-size:12px}
  .cboard > *{min-height:40px}
  .cboard .ch{min-height:64px;padding:6px 2px}
  .cboard .ch em{font-size:22px}
  .cboard .ct{font-size:18px}
  .mark{width:28px;height:28px}
  .gtitle strong{font-size:14px}
  .panel{padding:16px}
  /* Finestre a comparsa: pannello dal basso, pulsanti grandi a tutta larghezza */
  .modal{left:0;right:0;top:auto;bottom:0;transform:none;width:auto;max-height:88%;border-radius:24px 24px 0 0;border-bottom:0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));gap:14px;animation:sheet .22s ease-out}
  .modal::before{border-radius:24px 24px 0 0}
  .modal .h2{font-size:21px;overflow-wrap:anywhere}
  .modal p{margin:0;font-size:16px}
  .mact{flex-direction:column-reverse;align-items:stretch;gap:10px}
  .mact .btn{width:100%;min-height:54px;font-size:17px}
  /* Partita in corso: testo sopra, pulsanti sotto */
  .resume{gap:12px}
  .resume > .grow{flex:1 1 100%}
  .resume > .btn{flex:1 1 0;min-height:50px}
  /* Barra in basso: quattro sezioni sempre visibili */
  .tabs{gap:2px;padding-left:6px;padding-right:6px}
  .tabs a{flex:1 1 0;min-width:0;text-align:center;padding:11px 2px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Logo più compatto e "Inizia partita" sempre a portata di pollice */
  .dboard{width:min(300px,74vw)}
  .btn[data-act="startGame"]{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 0 0 6px var(--ink-2),0 14px 30px rgba(0,0,0,.55)}
  .panel[data-form="addPlayer"] .addrow{flex-direction:column;align-items:stretch}
  .scores.solo .pcard{padding:10px 12px 12px;gap:6px}
  .scores.solo .pc-head{flex-direction:row;justify-content:center;gap:8px}
  .scores.solo .pc-head .goose{width:48px;height:48px;margin:-6px 0}
  .scores.solo .pname{font-size:18px;flex:0 1 auto}
  .scores.solo .pscore{--sz:clamp(60px,19vw,84px)}
  .scores.solo .pmeta{font-size:13px}
  .cobox{padding:6px 10px;gap:8px}

}
@keyframes sheet{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (max-width:420px){
  .top{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
  .sync .slong{display:none}.sync .sshort{display:inline}
  .btn.install-app{width:40px;min-width:40px;padding:7px;font-size:0}
  .btn.install-app::before{content:"↓";font-size:18px}
  .install-app{padding:7px 8px;font-size:12px}
  .tabs a{font-size:13px}
  .brand .wordmark{font-size:13px}
}
@media (max-width:720px) and (max-height:760px){
  .scores.solo .pcard{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:12px;row-gap:6px;text-align:left}
  .scores.solo .pc-head{flex-direction:column;gap:0}
  .scores.solo .pname{font-size:15px;max-width:96px}

}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

function botTarget(g){

    const rem=P.score,out=g.cfg.out,r=route(rem,out,left,pro);

/* ============ Matematica delle freccette ============ */
const DARTS=[];
for(let n=1;n<=20;n++)for(let m=1;m<=3;m++)DARTS.push({n,m,v:n*m});
DARTS.push({n:25,m:1,v:25},{n:25,m:2,v:50});
const outOK=(m,out)=>out==='straight'?m>0:out==='double'?m===2:m>=2;
const UPTO=[new Set([0])];
for(let k=1;k<=3;k++){const s=new Set(UPTO[k-1]);UPTO[k-1].forEach(a=>DARTS.forEach(d=>s.add(a+d.v)));UPTO.push(s);}
const POSSIBLE=UPTO[3];
const MIN={};
['straight','double','master'].forEach(out=>{
  const arr=new Array(181).fill(0);
  for(let r=1;r<=180;r++){
    for(let k=1;k<=3&&!arr[r];k++){
      if(DARTS.some(d=>outOK(d.m,out)&&d.v<=r&&UPTO[k-1].has(r-d.v)))arr[r]=k;
    }
  }
  MIN[out]=arr;
});
const minDarts=(out,r)=>(r>=1&&r<=180)?MIN[out][r]:0;
const lab=d=>!d||d.n===0?'0':d.n===25?(d.m===2?'Bull':'25'):(d.m===3?'T':d.m===2?'D':'')+d.n;
const FINP={20:0,16:1,8:2,10:3,12:4,18:5,4:6,6:7,14:8,2:9,25:6.5};
function setupCost(d){
  if(d.n===25)return d.m===2?3.2:2.6;
  if(d.m===3)return d.n===20?0:d.n===19?.3:d.n===18?1:d.n===17?1.2:d.n===16?1.4:2+(20-d.n)*.05;
  if(d.m===2)return 3.5+(20-d.n)*.02;
  return .6+(20-d.n)*.02;
}
function finCost(d,out){
  if(out==='double')return d.n in FINP?FINP[d.n]:10+(20-d.n)*.05;
  if(out==='master'&&d.m===2)return d.n in FINP?FINP[d.n]:10;
  return setupCost(d);
}
const SUGG={};
function route(rem,out,left,pro){
  const need=minDarts(out,rem);
  if(!need||need>left)return null;
  const key=out+rem+(pro?pro.id:'');
  const finC=f=>{let c=finCost(f,out);if(pro&&f.m===2){if(pro.fav.includes(f.n))c-=2.5;if(pro.avoid&&pro.avoid.includes(f.n))c+=4;}return c;};
  if(SUGG[key]!==undefined)return SUGG[key];
  let best=null,bc=1e9;
  const fins=DARTS.filter(d=>outOK(d.m,out)&&d.v<=rem);
  for(const f of fins){
    const r=rem-f.v,fc=finC(f);
    if(need===1&&r===0&&fc<bc){bc=fc;best=[f];}
    if(need===2){for(const a of DARTS)if(a.v===r){const c=fc+setupCost(a);if(c<bc){bc=c;best=[a,f];}}}
    if(need===3){for(const a of DARTS){if(a.v>=r)continue;for(const b of DARTS){if(a.v+b.v!==r||b.v>a.v)continue;const c=fc+setupCost(a)+setupCost(b);if(c<bc){bc=c;best=[a,b,f];}}}}
  }
  SUGG[key]=best||null;
  return SUGG[key];
}
function suggest(rem,out,left){const r=route(rem,out,left);return r?r.map(lab).join('  '):null;}

  COLLS.forEach(name=>{

      db.collection(name).onSnapshot(snap=>{

async function writeDoc(c,id,body){

}
function writeErr(e){

  if(code==='quota_exceeded'){toast('Spazio della classifica esaurito: elimina qualche partita vecchia.');return;}

}
async function put(c,obj){
  const prev=S.data[c][obj.id];
  S.data[c]={...S.data[c],[obj.id]:obj};
  if(S.mode==='local'){saveLocal();return true;}
  const revert=()=>{const n={...S.data[c]};if(prev)n[obj.id]=prev;else delete n[obj.id];S.data[c]=n;};
  if(S.mode!=='cloud'){revert();toast('Puoi solo guardare: per registrare serve il permesso di modifica.');return false;}
  const {id,...body}=obj;
  try{await writeDoc(c,id,JSON.parse(JSON.stringify(body)));S.wrote=true;return true;}
  catch(e){revert();writeErr(e);scheduleRender();return false;}
}
async function del(c,id){
  const prev=S.data[c][id];

  catch(e){if(prev)S.data[c]={...S.data[c],[id]:prev};writeErr(e);scheduleRender();return false;}
}

/* ============ Password delle oche ============ */
function sha256(str){
  const b=unescape(encodeURIComponent(str)),K=[],H=[];let n=2,c=0;
  const isP=x=>{for(let d=2;d*d<=x;d++)if(x%d===0)return false;return true;};
  const fr=x=>((x-Math.floor(x))*4294967296)|0;
  while(c<64){if(isP(n)){if(c<8)H[c]=fr(Math.pow(n,1/2));K[c++]=fr(Math.pow(n,1/3));}n++;}
  const words=[],L=b.length*8;
  for(let i=0;i<b.length;i++)words[i>>2]|=(b.charCodeAt(i)&255)<<(24-(i%4)*8);
  words[L>>5]|=0x80<<(24-L%32);words[(((L+64)>>9)<<4)+15]=L;
  const r=(x,y)=>(x>>>y)|(x<<(32-y));
  for(let j=0;j<words.length;j+=16){
    const w=[];let [a,b2,c2,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      if(i<16)w[i]=words[j+i]|0;
      else{const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
      const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b2)^(a&c2)^(b2&c2)))|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c2;c2=b2;b2=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b2)|0;H[2]=(H[2]+c2)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}

  if(g.mode==='x01')g.ps.forEach(p=>{p.score=g.cfg.start;p.isIn=g.cfg.in==='straight';p.legTurns=0;});
  if(g.mode==='cricket')g.ps.forEach(p=>{p.marks={20:0,19:0,18:0,17:0,16:0,15:0,25:0};p.pts=0;});
  if(g.mode==='atc')g.ps.forEach(p=>{p.idx=0;});
  if(g.mode==='killer'){const nums=shuffle(Array.from({length:20},(_,k)=>k+1));g.ps.forEach((p,k)=>{p.num=nums[k];p.lives=g.cfg.lives;p.killer=false;p.outAt=0;});g.outSeq=0;}
}
function setLast(g,i,o){g.lastTurn[i]=o;(g.legLog=g.legLog||[]).push({k:i,...o});if(g.legLog.length>60)g.legLog.shift();}
function pushUndo(){UNDO.push(JSON.stringify(G));if(UNDO.length>300)UNDO.shift();}
function afterAction(){saveLive();render();}
function nextPlayer(){
  const g=G,n=g.ps.length;g.darts=[];g.turnCount++;
  let j=g.cur;
  for(let k=0;k<n;k++){j=(j+1)%n;if(!g.ps[j].out)break;}
  g.cur=j;
}
function legWon(i){
  const g=G,P=g.ps[i];
  P.legs++;
  if(g.mode==='atc'){P.st.best=P.st.best?Math.min(P.st.best,P.ld):P.ld;}
  let setWon=false,matchWon=false;
  if(P.legs>=g.cfg.legs){setWon=true;P.sets++;if(P.sets>=g.cfg.sets)matchWon=true;}
  if(matchWon){g.finished=true;g.winner=i;g.darts=[];finishMatch();return;}
  g.pending={type:setWon?'set':'leg',winner:i};
  if(setWon){g.ps.forEach(p=>p.legs=0);g.setNo++;g.legNo=1;}else g.legNo++;
  g.legStarter=(g.legStarter+1)%g.ps.length;
  resetLeg(g);
}
/* --- X01 --- */
function x01Commit(i,scored,darts,o){
  const P=G.ps[i],st=P.st;
  if(o.could)st.coOpp++;
  st.darts+=darts;st.points+=scored;
  if(P.legTurns<3){st.f9d+=darts;st.f9p+=scored;}
  P.legTurns++;
  if(scored>st.hi)st.hi=scored;
  if(scored===180)st.t180++;else if(scored>=140)st.t140++;else if(scored>=100)st.t100++;
  if(o.finish){st.coHit++;if(o.co>st.coHi)st.coHi=o.co;}
}
function couldFinish(P){return P.isIn&&minDarts(G.cfg.out,P.score)>0;}
function submitTotal(val,bustBtn){
  const g=G,i=g.cur,P=g.ps[i],out=g.cfg.out,rem=P.score;
  if(!Number.isInteger(val)||val<0||val>180||!POSSIBLE.has(val)){UI.typed='';render();toast(`${val} non si fa con tre freccette`);return;}
  const could=couldFinish(P);
  if(!bustBtn&&val===rem&&(P.isIn||g.cfg.in==='straight'||val>0)){
    const md=minDarts(out,rem);
    if(!md){UI.typed='';render();toast(`${rem} non si chiude con il ${OUTN[out]}`);return;}
    const opts=[1,2,3].filter(k=>k>=md);
    UI.typed='';
    if(opts.length===1){finishTotal(val,3,could);return;}
    g.ask={val,opts,could};render();return;
  }
  pushUndo();
  const left=rem-val;
  if(bustBtn||left<0||(left===1&&out!=='straight')){
    x01Commit(i,0,3,{could});setLast(g,i,{txt:'Sballato',bust:true});
    if(!bustBtn)toast(`Sballato! ${g.players[i].name} resta a ${rem}`);
  }else{
    if(!P.isIn&&val>0)P.isIn=true;
    P.score=left;x01Commit(i,val,3,{could});setLast(g,i,{txt:String(val)});
  }
  UI.typed='';nextPlayer();afterAction();
}
function finishTotal(val,darts,could){
  const g=G;g.ask=null;pushUndo();
  const i=g.cur,P=g.ps[i];
  P.isIn=true;P.score=0;x01Commit(i,val,darts,{could,finish:true,co:val});setLast(g,i,{txt:String(val)});
  legWon(i);afterAction();
}
function x01Dart(n,m){
  const g=G,i=g.cur,P=g.ps[i],out=g.cfg.out;
  pushUndo();
  if(g.darts.length===0){g.tStart=P.score;g.tIn=P.isIn;g.tCould=couldFinish(P);}
  let v=n*m;
  if(!P.isIn){const ok=g.cfg.in==='straight'||(g.cfg.in==='double'&&m===2)||(g.cfg.in==='master'&&m>=2);if(ok&&v>0)P.isIn=true;else v=0;}
  const left=P.score-v;
  g.darts.push({n,m,v});
  const labels=()=>g.darts.map(lab);
  if(left<0||(left===1&&out!=='straight')||(left===0&&!outOK(m,out))){
    P.score=g.tStart;P.isIn=g.tIn;
    x01Commit(i,0,g.darts.length,{could:g.tCould});
    setLast(g,i,{txt:'Sballato',bust:true,d:labels()});
    toast('Sballato!');nextPlayer();afterAction();return;
  }
  P.score=left;
  if(left===0){
    x01Commit(i,g.tStart,g.darts.length,{could:g.tCould,finish:true,co:g.tStart});
    setLast(g,i,{txt:String(g.tStart),d:labels()});legWon(i);afterAction();return;
  }
  if(g.darts.length===3){
    x01Commit(i,g.tStart-left,3,{could:g.tCould});
    setLast(g,i,{txt:String(g.tStart-left),d:labels()});nextPlayer();
  }
  afterAction();
}
/* --- Cricket --- */
function cricketWinner(g,cur){
  const order=[cur,...g.ps.map((_,k)=>k).filter(k=>k!==cur)];
  for(const k of order){
    const p=g.ps[k];
    if(!CT.every(t=>p.marks[t]>=3))continue;
    const others=g.ps.filter((_,j)=>j!==k);
    if(g.cfg.cricket==='nopoints'||!others.length)return k;
    if(g.cfg.cricket==='cut'){if(others.every(q=>p.pts<=q.pts))return k;}
    else if(others.every(q=>p.pts>=q.pts))return k;
  }
  return null;
}
function cricketDart(n,m){
  const g=G,i=g.cur,P=g.ps[i];
  pushUndo();
  g.darts.push({n,m,v:n*m});P.st.darts++;
  if(CT.includes(n)&&m>0){
    P.st.marks+=m;
    const add=Math.min(Math.max(0,3-P.marks[n]),m),extra=m-add;
    P.marks[n]+=add;
    if(extra>0&&g.cfg.cricket!=='nopoints'){
      const open=g.ps.filter((q,j)=>j!==i&&q.marks[n]<3);
      if(open.length){if(g.cfg.cricket==='cut')open.forEach(q=>q.pts+=extra*n);else P.pts+=extra*n;}
    }
  }
  const w=cricketWinner(g,i);
  if(w!==null){setLast(g,i,{d:g.darts.map(lab)});legWon(w);afterAction();return;}
  if(g.darts.length===3){setLast(g,i,{d:g.darts.map(lab)});nextPlayer();}
  afterAction();
}
/* --- Around the Clock --- */
const atcSeq=g=>{const s=Array.from({length:20},(_,k)=>k+1);if(g.cfg.bull)s.push(25);return s;};
function atcDart(n,m){
  const g=G,i=g.cur,P=g.ps[i],seq=atcSeq(g);
  pushUndo();
  g.darts.push({n,m,v:n*m});P.st.darts++;P.ld++;
  const t=seq[P.idx];
  if(n===t&&m>0){
    P.st.hits++;
    let ni=P.idx+(g.cfg.mult&&t!==25?m:1);
    if(g.cfg.bull&&t!==25)ni=Math.min(ni,seq.length-1);
    P.idx=Math.min(ni,seq.length);
  }
  if(P.idx>=seq.length){setLast(g,i,{d:g.darts.map(lab)});legWon(i);afterAction();return;}
  if(g.darts.length===3){setLast(g,i,{d:g.darts.map(lab)});nextPlayer();}
  afterAction();
}
/* --- Killer --- */
function killerDart(n,m){
  const g=G,i=g.cur,P=g.ps[i];
  pushUndo();
  g.darts.push({n,m,v:n*m});P.st.darts++;
  let c=0;
  if(n>=1&&n<=20)c=g.cfg.khit==='double'?(m===2?1:0):m;
  if(c>0){
    if(n===P.num){
      if(!P.killer){P.killer=true;toast(`${g.players[i].name} è killer!`);}
      else if(g.cfg.kself){P.lives=Math.max(0,P.lives-c);if(P.lives===0){P.out=true;P.outAt=++g.outSeq;toast('Autogol! Fuori.');}}
    }else if(P.killer){
      const j=g.ps.findIndex((q,k)=>k!==i&&q.num===n&&!q.out);
      if(j>=0){const Q=g.ps[j];Q.lives=Math.max(0,Q.lives-c);if(Q.lives===0){Q.out=true;Q.outAt=++g.outSeq;P.st.kills++;toast(`${g.players[j].name} è fuori!`);}}
    }
  }
  const alive=g.ps.map((_,k)=>k).filter(k=>!g.ps[k].out);
  if(alive.length<=1){setLast(g,i,{d:g.darts.map(lab)});legWon(alive.length?alive[0]:i);afterAction();return;}
  if(P.out||g.darts.length===3){setLast(g,i,{d:g.darts.map(lab)});nextPlayer();}
  afterAction();
}
function dartInput(n,m){
  if(!G||G.finished||G.pending||G.ask)return;
  if(G.mode==='x01')x01Dart(n,m);
  else if(G.mode==='cricket')cricketDart(n,m);
  else if(G.mode==='atc')atcDart(n,m);
  else killerDart(n,m);
}
/* --- Fine partita --- */
function ranking(g){
  const idx=g.ps.map((_,k)=>k);
  const tie=k=>{const p=g.ps[k];
    if(g.mode==='x01')return -p.score;
    if(g.mode==='cricket')return CT.reduce((a,t)=>a+Math.min(3,p.marks[t]),0)*1000+(g.cfg.cricket==='cut'?-p.pts:p.pts);
    if(g.mode==='atc')return p.idx;
    return p.out?p.outAt:1e6;};
  idx.sort((a,b)=>{if(a===g.winner)return -1;if(b===g.winner)return 1;const A=g.ps[a],B=g.ps[b];return (B.sets-A.sets)||(B.legs-A.legs)||(tie(b)-tie(a));});
  return idx.map(k=>g.players[k].id);
}
async function finishMatch(){
  const g=G;
  g.finishedAt=new Date().toISOString();
  const rec={id:g.id,mode:g.mode,cfg:g.cfg,label:modeTitle(g.mode,g.cfg),date:g.finishedAt,day:localDay(),startedAt:g.startedAt,ranked:g.ranked&&!g.players.some(p=>p.bot),vsBot:(g.players.find(p=>p.bot)||{}).bot||0,botPro:(g.players.find(p=>p.bot)||{}).pro||'',
    playerIds:g.players.map(p=>p.id),names:{},colors:{},skins:{},winnerId:g.players[g.winner].id,ranking:ranking(g),legs:{},sets:{},stats:{}};
  g.players.forEach((p,k)=>{rec.names[p.id]=p.name;rec.colors[p.id]=p.color;rec.skins[p.id]=normSkin(p.skin);rec.legs[p.id]=g.ps[k].legs;rec.sets[p.id]=g.ps[k].sets;rec.stats[p.id]=g.ps[k].st;});
  if(S.mode==='cloud-ro'||S.mode==='loading'){g.saveState='ro';return;}
  g.saveState='saving';
  const ok=await put('matches',rec);
  if(G&&G.id===g.id){g.saveState=ok?(S.mode==='local'?'local':'cloud'):'error';g.savedId=ok?rec.id:null;saveLive();if(UI.route==='partita')render();}
}

/* In multigiocatore (senza computer) sullo schermo resta solo chi deve tirare */

function matchStatRows(mode,ids,statsOf,legsOf,nameOf,colorOf){

  const rows=ids.map(id=>{const st=statsOf(id)||{};let c=[];
    if(mode==='x01')c=[nf1(st.darts?st.points/st.darts*3:0),nf1(st.f9d?st.f9p/st.f9d*3:0),st.hi||0,st.t180||0,st.t140||0,st.t100||0,st.coHi||'–',st.coOpp?pctS(st.coHit/st.coOpp):'–'];
    if(mode==='cricket')c=[nf2(st.darts?st.marks/st.darts*3:0),st.marks||0,st.darts||0];

  return `<div class="tblwrap"><table class="tbl"><thead><tr>${head.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;

function aggregate(mode){
  const A={};
  const get=id=>A[id]||(A[id]={id,played:0,wins:0,form:[],xd:0,xp:0,f9d:0,f9p:0,best:0,hi:0,t180:0,t140:0,t100:0,hiCo:0,coO:0,coH:0,cd:0,cm:0,kills:0,ad:0,ah:0,abest:0,last:null});
  for(const m of matches()){
    if(m.vsBot||(mode!=='all'&&m.mode!==mode))continue;
    for(const id of m.playerIds){
      if(id==='bot')continue;
      const a=get(id);a.played++;const w=m.winnerId===id;if(w)a.wins++;if(a.form.length<5)a.form.push(w);if(!a.last)a.last=m;
      const st=(m.stats&&m.stats[id])||{};
      if(m.mode==='x01'){a.xd+=st.darts||0;a.xp+=st.points||0;a.f9d+=st.f9d||0;a.f9p+=st.f9p||0;if(st.darts)a.best=Math.max(a.best,st.points/st.darts*3);a.hi=Math.max(a.hi,st.hi||0);a.t180+=st.t180||0;a.t140+=st.t140||0;a.t100+=st.t100||0;a.hiCo=Math.max(a.hiCo,st.coHi||0);a.coO+=st.coOpp||0;a.coH+=st.coHit||0;}
      if(m.mode==='cricket'){a.cd+=st.darts||0;a.cm+=st.marks||0;}
      if(m.mode==='atc'){a.ad+=st.darts||0;a.ah+=st.hits||0;if(st.best)a.abest=a.abest?Math.min(a.abest,st.best):st.best;}
      if(m.mode==='killer'){a.kills+=st.kills||0;}
    }
  }
  activePlayers().forEach(p=>get(p.id));
  return Object.values(A).map(a=>({...a,pct:a.played?a.wins/a.played:0,avg:a.xd?a.xp/a.xd*3:0,f9:a.f9d?a.f9p/a.f9d*3:0,coPct:a.coO?a.coH/a.coO:0,mpr:a.cd?a.cm/a.cd*3:0,acc:a.ad?a.ah/a.ad:0}));
}

function thumbVb(k,sk){
  let box=null;
  if(k==='face'||k==='eyes')box=[63,-1,46,46];
  else if(k==='hat')box=[50,-29,66,66];
  else if(k==='outfit')box=[-1,22,124,124];
  else if(k==='item'){const P=POSE[sk.pose],[x,y]=P.item,sy=P.shift?7:0;box=[x-44,y+sy-58,88,88];}
  if(!box)return undefined;
  if(sk.hand==='left')box[0]=122-box[0]-box[2];
  return box.join(' ');
}

function cellFmt(k,a){
  if(k==='pct'||k==='coPct'||k==='acc')return a.played?pctS(a[k]):'–';
  if(k==='avg'||k==='best'||k==='f9')return a[k]?nf1(a[k]):'–';
  if(k==='mpr')return a[k]?nf2(a[k]):'–';
  if(k==='hiCo'||k==='abest')return a[k]||'–';
  return a[k]||0;
}

function seasonRows(se){
  const pw=Number(se.pw)||0,pl=Number(se.pl)||0,modes=Array.isArray(se.modes)&&se.modes.length?se.modes:Object.keys(MODES);
  const R={};const get=id=>R[id]||(R[id]={id,pts:0,played:0,wins:0,manual:0,extra:0,xd:0,xp:0});
  for(const m of matches()){
    if(m.ranked===false||!modes.includes(m.mode))continue;
    const d=m.day||m.date.slice(0,10);if(!inSeason(se,d))continue;
    for(const id of m.playerIds){const r=get(id);r.played++;if(m.winnerId===id){r.wins++;r.pts+=pw;}else r.pts+=pl;
      if(m.mode==='x01'){const st=(m.stats&&m.stats[id])||{};r.xd+=st.darts||0;r.xp+=st.points||0;}}
  }
  Object.values(S.data.adjust).forEach(a=>{if(!a||a.seasonId!==se.id||!a.playerId)return;const r=get(a.playerId);const w=Number(a.wins)||0,x=Number(a.points)||0;r.manual+=w;r.wins+=w;r.extra+=x;r.pts+=w*pw+x;});
  return Object.values(R).sort((a,b)=>(b.pts-a.pts)||(b.wins-a.wins)||(a.played-b.played));
}
/* Trofei: stagioni chiuse (vince il primo in classifica) e competizioni registrate a mano.
   Ogni trofeo sblocca a caso una skin speciale che il vincitore non ha ancora: la scelta dipende solo dall'id del trofeo,
   quindi è la stessa su tutti i dispositivi. */
function hashStr(t){let h=5381;for(let i=0;i<t.length;i++)h=(Math.imul(h,33)^t.charCodeAt(i))>>>0;return h;}
let UNL={sig:null,trophies:[],by:{},owner:{}};
const SPEC_BY_KEY=Object.fromEntries(SPECIALS.map(o=>[o.key,o]));
/* La skin vinta resta salvata nel trofeo: una volta assegnata non cambia più e appartiene solo al vincitore.
   Le stagioni chiuse senza trofeo salvato ricevono la loro skin (dalle libere) e vengono registrate in automatico. */
function unlockState(){
  const sig=[S.data.matches,S.data.seasons,S.data.adjust,S.data.trophies,S.data.players,localDay()];
  if(UNL.sig&&UNL.sig.every((x,i)=>x===sig[i]))return UNL;
  const today=localDay(),docs=S.data.trophies||{},T=[];
  const closed=se=>se&&se.end&&se.end<today;
  for(const t of Object.values(docs)){
    if(!t||!t.playerId||!S.data.players[t.playerId])continue;
    if(t.kind==='season'){const se=S.data.seasons[t.seasonId];if(!closed(se))continue;
      T.push({id:t.id,kind:'season',seasonId:se.id,name:se.name,playerId:t.playerId,day:se.end,created:t.createdAt||'',stored:t.special||null});}
    else if(t.name)T.push({id:t.id,kind:'manual',name:String(t.name),playerId:t.playerId,day:t.day||'',created:t.createdAt||'',stored:t.special||null});
  }
  for(const se of seasons()){
    if(!closed(se)||docs['season_'+se.id])continue;
    const r=seasonRows(se)[0];
    if(r&&(r.pts>0||r.wins>0)&&S.data.players[r.id])T.push({id:'season_'+se.id,kind:'season',seasonId:se.id,name:se.name,playerId:r.id,day:se.end,created:'~',stored:null,pending:true});
  }
  T.sort((a,b)=>(a.created||'').localeCompare(b.created||'')||a.id.localeCompare(b.id));
  const owner={},by={};
  for(const t of T){const o=t.stored&&SPEC_BY_KEY[t.stored];if(o&&!owner[o.key]){t.special=o;owner[o.key]=t.playerId;}}
  for(const t of T){
    if(t.special)continue;
    const left=SPECIALS.filter(o=>!owner[o.key]);
    t.special=left.length?left[hashStr(t.id)%left.length]:null;
    if(t.special){owner[t.special.key]=t.playerId;t.needsSave=true;}
  }
  for(const t of T)if(t.special)(by[t.playerId]||(by[t.playerId]=[])).push({...t.special,trophy:t});
  T.sort((a,b)=>(a.day||'').localeCompare(b.day||'')||(a.created||'').localeCompare(b.created||''));
  UNL={sig,trophies:T,by,owner};return UNL;
}

  /* stagioni */
  selSeason(el){UI.seasonSel=el.dataset.id;UI.seasonEdit=null;render();},
  newSeason(){UI.seasonEdit='new';render();},
  editSeason(el){UI.seasonEdit=el.dataset.id;render();},
  cancelSeason(){UI.seasonEdit=null;render();},
  delSeason(el){const se=S.data.seasons[el.dataset.id];if(!se)return;confirmBox(`Eliminare ${se.name}?`,'Le partite restano nello storico; spariscono la classifica a punti della stagione e le vittorie aggiunte a mano.','Elimina stagione',async()=>{await del('seasons',se.id);for(const a of Object.values(S.data.adjust))if(a&&a.seasonId===se.id)await del('adjust',a.id);UI.seasonEdit=null;UI.seasonSel=null;render();});},
  delAdj(el){const a=S.data.adjust[el.dataset.id];if(!a)return;confirmBox('Eliminare questa voce?',`${pname(a.playerId)}, ${Number(a.wins)||0} vittorie.`,'Elimina',async()=>{await del('adjust',a.id);render();});},
  /* modale */
  delTrophy(el){const t=S.data.trophies[el.dataset.id];if(!t)return;confirmBox('Eliminare questo trofeo?',`${pname(t.playerId)}, ${t.name}. La skin speciale sbloccata con questo trofeo tornerà segreta.`,'Elimina',async()=>{await del('trophies',t.id);render();});},
  closeModal(){UI.modal=null;renderModal();if(UI.route==='partita')render();},
  modalAct(el){const a=UI.modal&&UI.modal.actions[Number(el.dataset.k)];UI.modal=null;renderModal();if(a&&a.fn)a.fn();else if(UI.route==='partita')render();}
};
const FORMS={
  async pwSet(f){const p=S.data.players[f.dataset.id];if(!p)return;const pw=String(new FormData(f).get('pw')||'');
    if(pw.length<PW_MIN)return toast(`La password deve avere almeno ${PW_MIN} caratteri`);
    if(!(await put('players',{...p,...pwRecord(pw)})))return;
    AUTH.add(p.id);const nx=AUTH_NEXT;AUTH_NEXT=null;UI.modal=null;renderModal();toast('Password salvata');if(nx&&nx.pid===p.id)nx.then();},
  pwCheck(f){const p=S.data.players[f.dataset.id];if(!p)return;const pw=String(new FormData(f).get('pw')||'');
    if(!pwOk(p,pw)){toast('Password sbagliata');const i=f.querySelector('input');if(i){i.value='';i.focus();i.classList.remove('shake');void i.offsetWidth;i.classList.add('shake');}return;}
    AUTH.add(p.id);const nx=AUTH_NEXT;AUTH_NEXT=null;UI.modal=null;renderModal();if(nx&&nx.pid===p.id)nx.then();},
  async pwChange(f){const p=S.data.players[f.dataset.id];if(!p)return;const pw=String(new FormData(f).get('pw')||'');
    if(pw.length<PW_MIN)return toast(`La password deve avere almeno ${PW_MIN} caratteri`);
    if(await put('players',{...p,...pwRecord(pw)})){UI.modal=null;renderModal();toast('Password cambiata');}},
  async newPlayer(f){const fd=new FormData(f);const name=String(fd.get('name')||'').trim(),pw=String(fd.get('pw')||'');
    if(!name)return toast('Serve un nome');if(pw.length<PW_MIN)return toast(`La password deve avere almeno ${PW_MIN} caratteri`);
    const p=await addPlayer(name,pw);if(!p)return;AUTH.add(p.id);
    if(f.dataset.where==='home'){UI.modal=null;renderModal();if(!UI.setup.players.includes(p.id))ACT.togglePlayer({dataset:{id:p.id}});else render();toast(`${p.name} è in partita`);}
    else{UI.modal=null;renderModal();openDress(p);toast(`Vestite l'oca di ${p.name}`);}},
  async addTrophy(f){const fd=new FormData(f);const name=String(fd.get('name')||'').trim().slice(0,40),pid=String(fd.get('player')||''),day=String(fd.get('day')||localDay());
    if(!name)return toast('Scrivi il nome della competizione');if(!S.data.players[pid])return toast('Scegli il vincitore');
    const t={id:uid(),name,playerId:pid,day,createdAt:new Date().toISOString()};
    const own=unlockState().owner,left=SPECIALS.filter(o=>!own[o.key]);t.special=left.length?left[hashStr(t.id)%left.length].key:null;
    if(await put('trophies',t)){render();}},
  async addPlayer(f){const fd=new FormData(f);const name=String(fd.get('name')||'').trim(),pw=String(fd.get('pw')||'');if(!name)return;
    if(pw.length<PW_MIN)return toast(`La password deve avere almeno ${PW_MIN} caratteri`);
    const p=await addPlayer(name,pw);if(p){AUTH.add(p.id);openDress(p);toast(`Vestite l'oca di ${p.name}`);}},
  async savePlayer(f){const p=S.data.players[f.dataset.id];if(!p||!UI.draft)return;if(p.pwHash&&!AUTH.has(p.id))return toast('Serve la password di questa oca');const name=f.querySelector('#ed-name').value.trim();if(!name)return toast('Serve un nome');
    if(players().some(q=>q.id!==p.id&&q.name.toLowerCase()===name.toLowerCase()))return toast('C\'è già un giocatore con questo nome');
    const d=UI.draft;UI.editId=null;UI.draft=null;
    const ok=await put('players',{...p,name,color:safeColor(d.color),skin:normSkin(d.skin)});render();window.scrollTo(0,0);if(ok)toast(`Oca di ${name} salvata`);},
  async saveSeason(f){const id=f.dataset.id||uid();const fd=new FormData(f);
    const se={id,name:String(fd.get('name')).trim(),start:String(fd.get('start')),end:String(fd.get('end')||''),pw:Number(fd.get('pw'))||0,pl:Number(fd.get('pl'))||0,modes:fd.getAll('modes').map(String).filter(m=>MODES[m])};
    if(!se.name||!se.start)return toast('Servono nome e data di inizio');
    if(se.end&&se.end<se.start)return toast('La chiusura viene prima dell\'inizio');
    if(!se.modes.length)return toast('Scegliete almeno un gioco che vale');
    const old=S.data.seasons[id];if(old&&old.createdAt)se.createdAt=old.createdAt;else se.createdAt=new Date().toISOString();
    if(await put('seasons',se)){UI.seasonEdit=null;UI.seasonSel=id;render();toast(old?'Stagione aggiornata':'Stagione creata');}},
  async addAdj(f){const fd=new FormData(f);const a={id:uid(),seasonId:f.dataset.season,playerId:String(fd.get('player')),wins:Math.round(Number(fd.get('wins'))||0),points:Math.round(Number(fd.get('points'))||0),day:String(fd.get('day')||localDay()),note:String(fd.get('note')||'').trim().slice(0,80),createdAt:new Date().toISOString()};
    if(!a.wins&&!a.points)return toast('Indicate vittorie o punti diversi da zero');
    if(await put('adjust',a)){render();toast(`Aggiunto a ${pname(a.playerId)}`);}}
};
async function addPlayer(name,pw){
  name=name.slice(0,24);
  const ex=players().find(q=>q.name.toLowerCase()===name.toLowerCase());
  if(ex){if(ex.active===false){await put('players',{...ex,active:true});toast(`${ex.name} torna in squadra`);return ex;}toast(`${ex.name} c'è già`);return null;}
  const used=new Set(players().map(p=>p.color));
  const color=COLORS.find(c=>!used.has(c))||COLORS[Math.floor(Math.random()*COLORS.length)];
  const p={id:uid(),name,color,skin:starterSkin(),active:true,createdAt:new Date().toISOString(),...(pw?pwRecord(pw):{})};
  return (await put('players',p))?p:null;
}
const CHG={
  histMode(el){UI.histMode=el.value;UI.histLimit=25;render();},
  histPlayer(el){UI.histPlayer=el.value;UI.histLimit=25;render();},
  h2h(el){UI.h2h[Number(el.dataset.k)]=el.value;render();}
};
function go(r){
  if(!VIEWS[r]||(r==='partita'&&!G))r='gioca';
  if(r==='gioca'&&UI.route!=='gioca')UI.heroLook=bizarreLook();
  if(r!=='giocatori'){UI.editId=null;UI.draft=null;}
  UI.route=r;UI.modal=null;render();window.scrollTo(0,0);
  try{if(location.hash!=='#'+r)location.hash=r;}catch(e){}
}

/* ============ Eventi ============ */
/* Ordine di tiro: trascina la maniglia (dito o mouse), oppure frecce su/giù sulla maniglia */
function setOrder(ids){const s=UI.setup,rest=s.players.filter(x=>!ids.includes(x));s.players=[...ids,...rest];saveSetup();}
document.addEventListener('pointerdown',e=>{
  if(e.button!==undefined&&e.button>0)return;
  const h=e.target.closest('.order.sortable .drag'),row=e.pointerType==='mouse'&&e.target.closest('.order.sortable li');if(!h&&!row)return;
  const li=h?h.closest('li'):row,list=li.parentElement;e.preventDefault();
  DRAG={li,list,pid:e.pointerId,y0:e.clientY,gap:parseFloat(getComputedStyle(list).rowGap)||6,order:[...list.children].map(x=>x.dataset.id),moved:false};
  li.classList.add('dragging');list.classList.add('sorting');
});
document.addEventListener('pointermove',e=>{
  if(!DRAG||e.pointerId!==DRAG.pid)return;
  e.preventDefault();
  const {li,list,gap}=DRAG;let dy=e.clientY-DRAG.y0;
  const next=li.nextElementSibling,prev=li.previousElementSibling;
  if(next&&dy>next.offsetHeight/2+gap){list.insertBefore(next,li);DRAG.y0+=next.offsetHeight+gap;DRAG.moved=true;}
  else if(prev&&dy<-(prev.offsetHeight/2+gap)){list.insertBefore(prev,li.nextSibling);DRAG.y0-=prev.offsetHeight+gap;DRAG.moved=true;}
  dy=e.clientY-DRAG.y0;
  li.style.transform=`translateY(${dy}px)`;
  DRAG.order=[...list.children].map(x=>x.dataset.id);
  [...list.children].forEach((x,k)=>{const o=x.querySelector('.ord');if(o)o.textContent=k+1;});
},{passive:false});
function endDrag(e){
  if(!DRAG||(e&&e.pointerId!==DRAG.pid))return;
  const d=DRAG;DRAG=null;
  d.li.style.transform='';d.li.classList.remove('dragging');d.list.classList.remove('sorting');
  if(d.moved)setOrder(d.order);
  if(d.moved||d.pending)render();
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',e=>{
  const h=e.target.closest&&e.target.closest('.order.sortable .drag');if(!h||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;
  e.preventDefault();e.stopPropagation();
  const ids=[...h.closest('ol').children].map(x=>x.dataset.id),i=ids.indexOf(h.dataset.id),j=i+(e.key==='ArrowUp'?-1:1);
  if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];setOrder(ids);render();
  const n=document.querySelector(`.order.sortable .drag[data-id="${CSS.escape(h.dataset.id)}"]`);if(n)n.focus();
},true);
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');
  if(a){e.preventDefault();if(a.dataset.act&&ACT[a.dataset.act]){ACT[a.dataset.act](a,e);return;}go(a.getAttribute('href').slice(1));return;}
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const f=ACT[el.dataset.act];if(!f)return;
  if(el.tagName!=='A')e.preventDefault();
  f(el,e);
});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=FORMS[f.dataset.form];if(h)h(f);});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.chg&&CHG[el.dataset.chg])CHG[el.dataset.chg](el);});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset||!UI.draft)return;
  if(el.dataset.bind==='draftName')UI.draft.name=el.value;
  if(el.dataset.bind==='draftTxt'){const t=cleanTxt(el.value);UI.draft.skin={...UI.draft.skin,txt:t||undefined,outfit:t?'jersey':UI.draft.skin.outfit};
    const st=document.querySelector('.stage > .goose');if(st)st.outerHTML=goose({color:UI.draft.color,skin:UI.draft.skin},'star');
    document.querySelectorAll('.wopts .opt[data-k="outfit"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===UI.draft.skin.outfit)));}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&UI.modal){UI.modal=null;renderModal();return;}
  if(UI.route!=='partita'||!G||G.finished||UI.modal)return;
  const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();ACT.undo();return;}
  if(G.mode!=='x01'||G.input!=='total'||G.pending||botTurn(G)||(UI.botView&&Date.now()<UI.botView.until))return;
  if(G.ask){if(/^[123]$/.test(e.key)&&G.ask.opts.includes(Number(e.key)))finishTotal(G.ask.val,Number(e.key),G.ask.could);return;}
  if(/^\d$/.test(e.key)){e.preventDefault();ACT.tk({dataset:{v:e.key}});}
  else if(e.key==='Backspace'){e.preventDefault();ACT.tkBack();}
  else if(e.key==='Enter'){e.preventDefault();ACT.tkOk();}
});
window.addEventListener('hashchange',()=>{const r=routeFromHash();if(r===UI.route||(r==='partita'&&!G))return;go(r);});
function routeFromHash(){const h=(location.hash||'').slice(1);return VIEWS[h]?h:'gioca';}

/* ============ Avvio ============ */
function boot(hot){
  hot=hot||{};
  installParts();
  const bm=$('#brandMark');if(bm)bm.innerHTML=brandLogoSVG();
  const live=hot.G?hot:ls.get('ndg-live',null);
  if(live&&live.G&&live.G.ps){G=live.G;UNDO=Array.isArray(live.UNDO)?live.UNDO:[];}
  const r=routeFromHash();UI.route=(r==='partita'&&!G)?'gioca':r;
  render();
  initStore();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({G,UNDO:UNDO.slice(-50)}));}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
